name: velure
services:
  app:
    image: velure-app:latest
    container_name: velure-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    networks: [velure]
    mem_limit: 384m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/staff/people').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2-alpine
    container_name: velure-caddy
    restart: unless-stopped
    environment:
      - VELURE_DOMAIN=${VELURE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    networks: [velure]
    mem_limit: 96m
    cpus: 0.5
    depends_on: [app]
networks:
  velure:
    name: velure
